[project]
name = "docugen"
version = "0.1.0"
description = "Automatiza la generación de documentos PDF a partir de datos (Excel, CSV, ODS)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet[all]>=0.86.5",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "reportlab>=5.0.0",
    "weasyprint>=69.0",
    "Jinja2>=3.1.2",
]
