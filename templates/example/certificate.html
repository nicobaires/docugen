<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Certificado</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="certificado">
      <h1>Certificado</h1>
      <p>Se certifica que</p>
      <h2>{{ Nombre }}</h2>
      <p>DNI: <strong>{{ Documento }}</strong></p>

      <p>Ha completado satisfactoriamente el curso:</p>
      <h3>{{ Curso }}</h3>

      <p class="fecha">Fecha: {{ Fecha }}</p>

      <div class="footer">
        <p>DocuGen — Ejemplo de plantilla</p>
      </div>
    </div>
  </body>
</html>
